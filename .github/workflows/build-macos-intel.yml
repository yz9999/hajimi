name: Build Hajimi macOS (Intel)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      arch:
        description: '编译目标架构 (x86_64 / arm64 / x86_64 arm64)'
        required: false
        default: 'x86_64'
        type: choice
        options:
          - 'x86_64'
          - 'arm64'
          - 'x86_64 arm64'
      run_smoke_tests:
        description: '编译后执行内建自检验证 (推荐开启)'
        required: false
        default: true
        type: boolean

# 遵循 GitHub 最小权限安全规范
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MACOSX_DEPLOYMENT_TARGET: '13.0'
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'
  HOMEBREW_NO_ENV_HINTS: '1'

jobs:
  build-macos:
    name: Build 哈基米.app (${{ inputs.arch || 'x86_64' }})
    # GitHub 已下线 macos-13 与 macos-14，当前官方标准 Intel (x86_64) 运行器标签为 macos-15-intel
    # 配合 MACOSX_DEPLOYMENT_TARGET=13.0 交叉控制，产物原生兼容 macOS 13.0+ Intel 机型
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate Project Root & Clean Stale Local Artifacts
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "Package.swift" ] && [ -f "Makefile" ]; then
            PROJECT_DIR="$PWD"
          else
            PROJECT_DIR="$(find "$PWD" -maxdepth 3 -name "Package.swift" -exec dirname {} \; | head -n 1)"
          fi
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/Makefile" ]; then
            echo "::error::未找到 Package.swift 或 Makefile，请检查仓库目录结构。"
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Located project directory: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          # 赋予所有构建与签名脚本可执行权限（防止网页上传或解压丢失 +x 权限导致 Permission denied）
          chmod +x scripts/*.sh SmokeTests/*.sh NetworkExtension/*.sh 编译打包.command 2>/dev/null || true

          # 清理本地打包遗留的 .build 缓存（保留 Vendor 目录以便命中缓存），避免残留绝对路径导致 SwiftPM 报错
          if [ -d ".build" ]; then
            find .build -mindepth 1 -maxdepth 1 ! -name 'Vendor' -exec rm -rf {} +
          fi

      - name: Cache Native C/C++ Vendor Dependencies (OpenSSL 3.5+ / ngtcp2 / nghttp3 / libssh2)
        uses: actions/cache@v4
        with:
          path: ${{ steps.locate.outputs.project_dir }}/.build/Vendor
          key: hajimi-vendor-macos13-${{ runner.os }}-${{ inputs.arch || 'x86_64' }}-${{ hashFiles('**/scripts/build_native_core.sh', '**/scripts/build_cpp_quic.sh', '**/scripts/build_cpp_ssh.sh') }}
          restore-keys: |
            hajimi-vendor-macos13-${{ runner.os }}-${{ inputs.arch || 'x86_64' }}-

      - name: Build Native C/C++ Core (OpenSSL 3.5+ Static, QUIC & SSH)
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          TARGET_ARCHS="${{ inputs.arch || 'x86_64' }}"
          export HAJIMI_ARCHS="$TARGET_ARCHS"
          export HAJIMI_BUILD_JOBS="$(sysctl -n hw.ncpu 2>/dev/null || echo 4)"

          # 执行项目内建的依赖构建脚本（自动校验/编译支持 QUIC API 的 OpenSSL 3.5+ 静态库、ngtcp2、nghttp3、libssh2）
          ./scripts/build_native_core.sh

          # 验证静态库与头文件均已就绪
          test -f ".build/Vendor/OpenSSL/lib/libssl.a"
          test -f ".build/Vendor/OpenSSL/lib/libcrypto.a"
          test -f ".build/Vendor/HajimiQUIC/lib/libngtcp2.a"
          test -f ".build/Vendor/HajimiQUIC/lib/libngtcp2_crypto_ossl.a"
          test -f ".build/Vendor/HajimiQUIC/lib/libnghttp3.a"
          test -f ".build/Vendor/HajimiSSH/lib/libssh2.a"

      - name: Build & Package 哈基米.app (Release)
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          TARGET_ARCHS="${{ inputs.arch || 'x86_64' }}"
          VENDOR_OPENSSL="$PWD/.build/Vendor/OpenSSL"

          # 显式指定 HAJIMI_OPENSSL_ROOT 指向已通过 QUIC API 校验的 .build/Vendor/OpenSSL，
          # 防止 Makefile 与 Package.swift 误读系统旧版 OpenSSL 导致链接符号缺失
          make app archive \
            ARCHS="$TARGET_ARCHS" \
            BUILD_CONFIG=release \
            HAJIMI_OPENSSL_ROOT="$VENDOR_OPENSSL"

      - name: Verify Bundle Integrity, Signatures & Self-Tests
        if: ${{ inputs.run_smoke_tests != false }}
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          APP_BUNDLE="dist/哈基米.app"
          MAIN_BIN="$APP_BUNDLE/Contents/MacOS/Hajimi"
          HELPER_BIN="$APP_BUNDLE/Contents/Resources/HajimiHelper"

          file "$MAIN_BIN"
          file "$HELPER_BIN"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"
          /usr/bin/plutil -lint "$APP_BUNDLE/Contents/Info.plist"

          # 运行无网络副作用的内建安全与协议自检
          "$MAIN_BIN" --native-quic-codec-test
          "$MAIN_BIN" --protocol-adapter-smoke-test
          "$MAIN_BIN" --ingress-security-self-test
          "$MAIN_BIN" --network-optimization-self-test
          "$MAIN_BIN" --native-dataplane-self-test
          "$HELPER_BIN" --self-test

      - name: Create Distributable DMG Installer
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          TARGET_ARCHS="${{ inputs.arch || 'x86_64' }}"
          if [ "$(echo $TARGET_ARCHS | wc -w)" -gt 1 ]; then
            FLAVOR="universal"
          else
            FLAVOR="$(echo $TARGET_ARCHS | awk '{print $1}')"
          fi
          DMG_STAGE="$(mktemp -d)"
          cp -R "dist/哈基米.app" "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications"
          hdiutil create -volname "哈基米" \
            -srcfolder "$DMG_STAGE" \
            -ov -format UDZO \
            "dist/哈基米-0.1.0-${FLAVOR}.dmg"
          rm -rf "$DMG_STAGE"
          ls -lh dist/

      - name: Upload Build Artifacts (.zip & .dmg)
        uses: actions/upload-artifact@v4
        with:
          name: Hajimi-macOS13-${{ runner.arch }}-Build
          path: |
            ${{ steps.locate.outputs.project_dir }}/dist/*.zip
            ${{ steps.locate.outputs.project_dir }}/dist/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.locate.outputs.project_dir }}/dist/*.zip
            ${{ steps.locate.outputs.project_dir }}/dist/*.dmg
          generate_release_notes: true
